<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito JS</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; gap: 2rem; padding: 20px; }
    .productos, .carrito { border: 1px solid #ccc; padding: 15px; border-radius: 8px; width: 300px; }
    .producto { border-bottom: 1px solid #eee; padding: 10px 0; }
    button { cursor: pointer; }
  </style>
</head>
<body>

  <section class="productos">
    <h2>Productos</h2>
    <div id="contenedor-productos"></div>
  </section>

  <section class="carrito">
    <h2>Tu Carrito</h2>
    <ul id="lista-carrito"></ul>
    <p><strong>Total: $<span id="total">0</span></strong></p>
    <button id="vaciar-carrito">Vaciar Carrito</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
